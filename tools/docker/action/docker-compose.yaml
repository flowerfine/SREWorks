version: "3.8"

services:

  mysql:
    image: bitnamilegacy/mysql:8.0
    container_name: mysql
    environment:
      - TZ=Asia/Shanghai
      - MYSQL_ROOT_USER=root
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_AUTHENTICATION_PLUGIN=mysql_native_password
      - MYSQL_DATABASE=appmanager
    ports:
      - 3306:3306
    healthcheck:
      test: [ "CMD", "mysqladmin", "-u$$MYSQL_ROOT_USER", "-p$$MYSQL_ROOT_PASSWORD",  "ping", "-h", "localhost" ]
      interval: 3s
      timeout: 1s
      retries: 16
      start_period: 30s
    volumes:
      - ../mysql/my_custom.cnf:/opt/bitnami/mysql/conf/my_custom.cnf
      - ../mysql/init.d:/docker-entrypoint-initdb.d
    networks:
      - appmanager


  flycore-paas-action-db-migration:
    image: sreworks-registry.cn-beijing.cr.aliyuncs.com/hub/flycore-paas-action-db-migration:1685142711343
    container_name: flycore-paas-action-db-migration
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=abm_paas_action
    volumes:
      - ./application.properties:/app
    networks:
      - appmanager

  flycore-paas-action-paas-action:
    image: sreworks-registry.cn-beijing.cr.aliyuncs.com/hub/flycore-paas-action-paas-action:1685142711343
    container_name: flycore-paas-action-paas-action
    depends_on:
      flycore-paas-action-db-migration:
        condition: service_completed_successfully
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: 123456
      DB_NAME: abm_paas_action
      ENDPOINT_PAAS_HOME: xxx
      ENDPOINT_PAAS_TKGONE: xxx
      URL_PAAS_HOME: xxx
    ports:
      - 7007:7001
    networks:
      - appmanager

networks:
  appmanager:
    driver: bridge